<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Спрея</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css">
</head>
<body>

<div id="mainView">
<header>
  <div class="title" data-i18n="title">Спрея</div>
  <div class="header-controls">
    <button class="theme-btn" id="themeBtn" title="Theme">☾</button>
    <div class="lang-toggle" id="langToggle">
      <button data-lang="uk">UK</button>
      <button data-lang="en">EN</button>
    </div>
  </div>
</header>

<button class="session-entry" id="sessionEntry"></button>

<section>
  <h2 data-i18n="potatoSpeed">Швидкість картоплі</h2>

  <div class="timer-block">
    <div class="timer-display idle" id="timerDisplay">00:00:00</div>
    <div class="lap-display hidden" id="lapDisplay">
      <span class="lap-display-label">КОЛО</span>
      <span class="lap-display-time" id="lapTime">00:00:00</span>
    </div>

    <div class="btn-row" style="margin-bottom:14px;">
      <button class="btn btn-primary" id="timerBtn" data-i18n="start">СТАРТ</button>
      <button class="btn btn-secondary hidden" id="resetBtn" data-i18n="reset" style="flex:0 0 44%;">Скинути</button>
    </div>

    <div class="streams">
      <div class="streams-label" data-i18n="streamsLabel">Ваги ємкостей</div>
      <div id="streamsList"></div>
      <button class="add-stream-btn" id="addStreamBtn" data-i18n="addStream">+ Додати потік</button>
      <div class="stream-total">
        <span class="label" data-i18n="totalDelta">Набрано</span>
        <span class="value"><span id="streamTotal">0</span> <span data-i18n="kg">кг</span></span>
        <div style="display:flex;align-items:center;gap:6px;margin-left:auto;">
          <input type="number" id="manualSpeedVis" inputmode="decimal" placeholder="0" style="width:70px;background:var(--bg);border:1px solid var(--teal);color:var(--teal);font-family:var(--mono);font-size:14px;padding:4px 8px;border-radius:5px;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;outline:none;">
          <span style="font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--teal);font-family:var(--mono);" data-i18n="kgPerMin">кг/хв</span>
        </div>
      </div>
    </div>
  </div>

  <input type="number" id="manualSpeed" inputmode="decimal" placeholder="0" style="display:none">
</section>

<div class="speed-display" style="display:block;text-align:center;padding:20px 0 16px;">
  <div class="num zero" id="speedNum">0</div>
  <div class="unit" data-i18n="kgPerMin">кг/хв</div>
  <div class="secondary"><span id="speedHour">0</span> <span data-i18n="kgPerHour">кг/год</span></div>
</div>

<section>
  <h2 data-i18n="preparations">Препарати</h2>
  <div id="prepList"></div>
  <button class="add-prep-btn" id="addPrepBtn" data-i18n="addPrep">+ Додати препарат</button>
</section>

<footer>СПРЕЯ · v0.6</footer>

<button class="add-stream-btn" id="historyEntry" style="margin-top:24px;">📋 <span data-i18n="sessionsBtn">Завершені сесії</span></button>
</div>

<div id="sessionView" class="hidden"></div>
<div id="historyView" class="hidden"></div>

<script src="./app.js"></script>
</body>
</html>
