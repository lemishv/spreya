<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="description" content="Спрея — швидкість потоку картоплі, дозування препаратів і облік сесій обробки">
<title>Спрея</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css?v=0.7.0">
</head>
<body>

<div id="mainView">
<header>
  <h1 class="title" data-i18n="title">Спрея</h1>
  <div class="header-controls">
    <button class="theme-btn" id="themeBtn" aria-label="Перемкнути тему" data-i18n-aria="ariaTheme">☾</button>
    <div class="lang-toggle" id="langToggle" role="group" aria-label="Мова / Language">
      <button data-lang="uk" aria-pressed="true">UK</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>
</header>

<button class="session-entry" id="sessionEntry"></button>

<section>
  <h2 data-i18n="potatoSpeed">Швидкість картоплі</h2>

  <div class="timer-block">
    <div class="timer-display idle" id="timerDisplay" aria-live="off">00:00:00</div>
    <div class="lap-display empty" id="lapDisplay">
      <span class="lap-display-label" data-i18n="lap">КОЛО</span>
      <span class="lap-display-time" id="lapTime">—</span>
    </div>

    <div class="btn-row timer-controls">
      <button class="btn btn-primary" id="timerBtn">СТАРТ</button>
      <button class="btn btn-secondary hidden" id="timerBtn2">Скинути</button>
    </div>

    <div class="streams">
      <div class="streams-label" data-i18n="streamsLabel">Ваги</div>
      <div id="streamsList"></div>
      <button class="add-stream-btn" id="addStreamBtn" data-i18n="addStream">+ Додати ваги</button>
      <div class="stream-total">
        <span class="label" data-i18n="totalDelta">Набрано</span>
        <span class="value"><span id="streamTotal">0</span> <span data-i18n="kg">кг</span></span>
      </div>
    </div>
  </div>
</section>

<div class="speed-display">
  <div class="num zero" id="speedNum" aria-live="polite">0</div>
  <div class="unit" data-i18n="kgPerMin">кг/хв</div>
  <div class="secondary"><span id="speedHour">0</span> <span data-i18n="kgPerHour">кг/год</span></div>

  <div class="speed-source">
    <div class="seg" id="speedMode" role="radiogroup" aria-label="Джерело швидкості">
      <button data-mode="calc" role="radio" aria-checked="true" data-i18n="modeCalc">Розрахунок</button>
      <button data-mode="manual" role="radio" aria-checked="false" data-i18n="modeManual">Вручну</button>
    </div>
    <label class="manual-row hidden" id="manualRow">
      <input type="number" id="manualSpeed" inputmode="decimal" min="0" placeholder="0">
      <span class="manual-unit" data-i18n="kgPerMin">кг/хв</span>
    </label>
    <button class="speed-hint hidden" id="speedHint"></button>
  </div>
</div>

<section>
  <h2 data-i18n="preparations">Препарати</h2>
  <div id="prepList"></div>
  <button class="add-prep-btn" id="addPrepBtn" data-i18n="addPrep">+ Додати препарат</button>
</section>

<button class="add-stream-btn history-entry" id="historyEntry">📋 <span data-i18n="sessionsBtn">Завершені сесії</span></button>

<section class="data-section">
  <h2 data-i18n="dataLabel">Дані</h2>
  <div class="btn-row">
    <button class="btn btn-secondary" id="exportBtn" data-i18n="exportBtn">Експорт (JSON)</button>
    <button class="btn btn-secondary" id="importBtn" data-i18n="importBtn">Імпорт (JSON)</button>
  </div>
  <p class="data-hint" data-i18n="exportHint">Усі препарати, сесії та налаштування — в один файл. Зберігайте копію: дані живуть лише в цьому браузері.</p>
  <input type="file" id="importFile" accept="application/json,.json" class="hidden">
</section>

<footer>СПРЕЯ · <span id="appVersion"></span></footer>
</div>

<div id="sessionView" class="hidden"></div>
<div id="historyView" class="hidden"></div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="./calc.js?v=0.7.0"></script>
<script src="./app.js?v=0.7.0"></script>
</body>
</html>
